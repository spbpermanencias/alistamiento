<title>Alistamiento – Chequeador</title>

<style>
:root{--bg:#FFFFFF;--panel:#FFFFFF;--panel2:#F7FAFD;--ink:#0B2A4A;--muted:#50657A;--line:#C9D8E6;
--blue:#0056A6;--blue-soft:#DCEBF8;--cyan:#11BFEF;--amber:#9A6A00;--amber-soft:#FFF4CC;--red:#B8322A;--green:#2E7D4F;--green-soft:#DDF1E4;
--plate:#FFCA08;--plate-ink:#111;
--sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:400 16px/1.35 var(--sans);background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
h1,h2{font-family:var(--cond);font-weight:600;margin:0;line-height:1.15}
.logo{display:inline-block;background:#fff;border-radius:8px;padding:4px 8px;line-height:0}.logo img{height:34px;width:auto;display:block}
/* Login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#fff}
.login[hidden]{display:none}
.box{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:12px;padding:26px 24px;box-shadow:0 8px 28px rgba(11,42,74,.15)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:18px}
.brand .logo{padding:0}.brand .logo img{height:58px}
.brand .t{border-top:2px solid var(--cyan);padding-top:10px;width:100%}
.brand h1{font-size:1.75rem;color:var(--ink)}.brand small{color:var(--muted);font-size:.95rem}
.box p{color:var(--muted);margin:0 0 14px}
input[type=search],input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:500 16px var(--sans);margin-bottom:10px;background:var(--panel);color:var(--ink);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.err{color:var(--red);min-height:20px;margin:2px 0 6px;font-weight:500}
.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;font:700 1.25rem var(--cond);letter-spacing:.04em;text-transform:uppercase;background:var(--blue);color:#fff;cursor:pointer}
.btn.g{background:var(--green);color:#fff}.btn.o{background:transparent;color:var(--blue);border:2px solid var(--blue)}.btn:disabled{opacity:.4}.btn:active{filter:brightness(.92)}
.box .btn{margin-top:4px}
/* App */
header{background:#fff;color:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--cyan)}
header .logo{padding:0}header .logo img{height:36px}
header .t{border-left:2px solid var(--cyan);padding-left:12px;flex:1;min-width:0;line-height:1.15}
header .t b{display:block;color:var(--blue);font:600 1.3rem var(--cond)}header .t small{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:8px;padding:7px 12px;font:600 .95rem var(--sans)}
.tabs{display:flex;background:var(--panel);position:sticky;top:0;box-shadow:0 2px 6px rgba(0,30,60,.15);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 4px;font:600 1.2rem var(--cond);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;display:flex;justify-content:center;align-items:center;gap:6px}
.tabs button[aria-selected=true]{color:var(--blue);border-color:var(--blue)}
.tabs b{min-width:24px;padding:0 7px;border-radius:12px;background:var(--line);color:var(--ink);font:700 1rem var(--cond);line-height:1.5}.tabs b.pend{background:var(--cyan);color:#06243f}
.wrap{padding:12px;max-width:560px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,30,60,.12)}
.l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plate{display:inline-block;font:700 1.9rem var(--cond);letter-spacing:.08em;background:var(--plate);color:var(--plate-ink);border:2px solid #111;border-radius:6px;padding:0 10px;line-height:1.3}
.tn{background:#263238;color:#FFD54F;border-radius:6px;padding:0 8px;font:800 1.15rem var(--cond);line-height:1.5}
.sub{font-size:.95rem;color:var(--muted);margin-top:5px}.sub b{font:600 1.1rem var(--cond);color:var(--ink);font-variant-numeric:tabular-nums}
.ok{color:var(--green);font-weight:600}.wait{color:var(--amber);font-weight:600;background:var(--amber-soft);border-radius:8px;padding:3px 10px;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font:500 1.15rem var(--cond)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--green);color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:9;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}#toast.e{background:var(--red)}
</style>
</head>
<body>
<div id="login" class="login"><div class="box">
<div class="brand"><span class="logo"><img data-logo alt="Sociedad Portuaria Buenaventura"></span><div class="t"><h1>Alistamiento · Chequeador</h1><small>Ingresa con tu usuario del sistema</small></div></div>
<form id="fl"><input id="u" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="none"><input id="p" type="password" placeholder="Clave" autocomplete="current-password"><div class="err" id="le"></div><button class="btn">Entrar</button></form></div></div>
<div id="clave" class="login" hidden><div class="box">
<div class="brand"><span class="logo"><img data-logo alt="Sociedad Portuaria Buenaventura"></span><div class="t"><h1>Cambia tu clave</h1></div></div>
<p>Es tu primer ingreso: define una clave nueva (mínimo 6 caracteres).</p>
<form id="fc"><input id="n1" type="password" placeholder="Clave nueva" autocomplete="new-password"><input id="n2" type="password" placeholder="Repite la clave" autocomplete="new-password"><div class="err" id="ce"></div><button class="btn">Guardar clave</button></form></div></div>
<div id="app" hidden>
<header><span class="logo"><img data-logo alt="SPB"></span><div class="t"><b>Alistamiento</b><small id="who"></small></div><button id="out">Salir</button></header>
<nav class="tabs"><button data-t="recibo">Recibo <b>0</b></button><button data-t="entrega">Entrega <b>0</b></button><button data-t="salida">Salida <b>0</b></button></nav>
<div class="wrap"><input id="q" type="search" placeholder="Buscar placa" autocapitalize="characters"><div id="list"></div></div>
</div>
<div id="toast"></div>

    const r=p&&await ok(sb.from('roles').select('*').eq('id',p.rol_id).maybeSingle());
    if(!p||!p.activo||!r||!r.activo){await sb.auth.signOut();pantalla('login');$('#le').textContent=!p?'Este usuario no tiene perfil en el sistema.':!p.activo?'Este usuario está desactivado.':'El rol de este usuario está desactivado.';return}
    if(!(r.puede_chequeador||r.puede_admin)){await sb.auth.signOut();pantalla('login');$('#le').textContent='El usuario '+p.usuario.toUpperCase()+' tiene el rol '+(r.nombre||r.id)+', que no tiene permiso de Chequeador. Entra con un usuario de rol CHEQUEADOR.';return}
    me=p;$('#who').textContent=p.nombre||p.usuario;
    if(p.debe_cambiar_clave){pantalla('clave');return}
    pantalla('app');await cargar();suscribir();
  }catch(e){pantalla('login');$('#le').textContent=e.message}
}
async function cargar(){
  const [vs,fs]=await Promise.all([
    ok(sb.from('visitas').select('id,placa,dia,turno,operadores,bls,etapa_actual,chequeador_id,chequeador_relevo_id,visita_etapas(etapa_id,inicio,fin)').eq('estado','en_proceso').in('etapa_actual',Object.values(ET))),
    ok(sb.from('funcionarios').select('id,nombre'))]);
  F={};(fs||[]).forEach(f=>F[f.id]=f.nombre);
  V=(vs||[]).map(v=>{const e={};(v.visita_etapas||[]).forEach(x=>e[x.etapa_id]=x);return {...v,e}});
  render();
}
function pedir(){clearTimeout(pedido);pedido=setTimeout(()=>cargar().catch(()=>{}),400)}
function suscribir(){
  if(canal)return;
  canal=sb.channel('alist').on('postgres_changes',{event:'*',schema:'public',table:'visitas'},pedir).subscribe();
  setInterval(()=>{if(!$('#app').hidden)pedir()},20000);
}
function lista(t){return V.filter(v=>v.etapa_actual===ET[t]&&v.e[ET[t]]).sort((a,b)=>String(a.e[ET[t]].inicio).localeCompare(String(b.e[ET[t]].inicio)))}
function render(){
  const qn=norm($('#q').value);
  document.querySelectorAll('.tabs button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.t===tab);const n=lista(b.dataset.t).length,x=b.querySelector('b');x.textContent=n;x.classList.toggle('pend',n>0)});
  const all=lista(tab),l=qn?all.filter(v=>norm(v.placa).includes(qn)):all;
  const sin=all.filter(v=>!v.chequeador_id);
  const cab=v=>`<div class="l1">${v.turno?`<span class="tn">T${esc(v.turno)}</span>`:''}<span class="plate">${esc(v.placa)}</span></div><div class="sub">${esc((v.operadores||[]).join(', '))}</div>${(v.bls||[]).length?`<div class="sub">BL: ${esc(v.bls.join(', '))}</div>`:''}`;
  const t=x=>`<b data-s="${esc(x)}">00:00:00</b>`;
  let h='';
  if(tab==='recibo')h=l.map(v=>`<div class="card">${cab(v)}<div class="sub">En Ingreso al sistema ${t(v.e.ingate.inicio)}</div><button class="btn" data-a="recibo" data-id="${v.id}">Recibo</button></div>`).join('');
  else if(tab==='entrega')h=l.map(v=>{const n=v.chequeador_id&&F[v.chequeador_id];
    return `<div class="card">${cab(v)}${n?`<div class="sub ok">👷 ${esc(n)}, buscando mercancía</div>`:`<div class="sub wait">⏳ Esperando chequeador, fila #${sin.indexOf(v)+1}</div>`}${v.chequeador_relevo_id?`<div class="sub ok">🔁 Relevo: ${esc(F[v.chequeador_relevo_id]||'')}</div>`:''}<div class="sub">Recibido ${hm(v.e.alistamiento.inicio)} · alistamiento ${t(v.e.alistamiento.inicio)}</div><button class="btn g" data-a="entrega" data-id="${v.id}" ${n?'':'disabled'}>Entrega</button>${v.chequeador_relevo_id?`<button class="btn o" data-a="cambio" data-id="${v.id}">🔁 Cambio de turno</button>`:''}</div>`}).join('');
  else h=l.map(v=>`<div class="card">${cab(v)}${v.chequeador_id&&F[v.chequeador_id]?`<div class="sub">Entregó: ${esc(F[v.chequeador_id])}</div>`:''}<div class="sub">En Entrega operador ${t(v.e.entrega_operador.inicio)}</div><button class="btn" data-a="salida" data-id="${v.id}">Salida</button></div>`).join('');
  $('#list').innerHTML=h||`<div class="empty">${qn&&all.length?'Ninguna placa coincide.':{recibo:'No hay vehículos por recibir.',entrega:'No hay placas en alistamiento.',salida:'No hay placas en Entrega operador.'}[tab]}</div>`;
  tick();
}
function tick(){const n=Date.now();document.querySelectorAll('[data-s]').forEach(b=>{const s=Math.max(0,Math.floor((n-new Date(b.dataset.s))/1000));b.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')})}
setInterval(tick,1000);
async function accion(a,id){
  const v=V.find(x=>x.id===id);if(!v||busy)return;busy=true;
  try{
    if(a==='recibo'){
      const antes=lista('recibo').filter(x=>x.id!==id&&String(x.e.ingate.inicio)<String(v.e.ingate.inicio)).map(x=>x.placa);
      const msg=antes.length?`⚠ ${v.placa} no es el siguiente en la fila.\nAntes debía recibirse: ${antes.join(', ')}.\nSe avisará a Registro. ¿Recibir de todos modos?`:`¿Recibo del vehículo ${v.placa}?`;
      if(!confirm(msg))return;
      await ok(sb.rpc('chequeador_confirmar_recibo',{p_visita:id}));
      if(antes.length)await sb.rpc('chequeador_recibo_fuera_orden',{p_visita:id,p_antes:antes});
      await sb.rpc('asignar_chequeadores');toast(v.placa+' recibido en alistamiento');
    }else if(a==='entrega'){
      if(!v.chequeador_id){toast('Aún no tiene chequeador asignado',true);return}
      if(!confirm(`¿Entrega de ${v.placa}?`))return;
      await ok(sb.rpc('chequeador_confirmar_entrega',{p_visita:id,p_funcionario:v.chequeador_id}));
      await sb.rpc('asignar_chequeadores');toast(v.placa+' pasó a Entrega operador');
    }else if(a==='cambio'){
      if(!confirm(`¿Cambio de turno de ${v.placa}?`))return;
      await ok(sb.rpc('cambio_turno_visita',{p_visita:id}));toast('Cambio de turno hecho');
    }else if(a==='salida'){
      if(!confirm(`¿Salida de ${v.placa}?`))return;
      await ok(sb.rpc('chequeador_salida',{p_visita:id}));toast(v.placa+' pasó a Salida sistema');
    }
  }catch(e){toast(e.message||'No se pudo completar la acción',true)}
  finally{busy=false;await cargar().catch(()=>{})}
}
$('#fl').addEventListener('submit',async e=>{e.preventDefault();$('#le').textContent='';
  const u=$('#u').value.trim().toLowerCase(),p=$('#p').value.toUpperCase();if(!u||!p){$('#le').textContent='Escribe usuario y clave.';return}
  const r=await sb.auth.signInWithPassword({email:u+DOM,password:p});
  if(r.error){$('#le').textContent='Usuario o clave incorrectos.';return}
  $('#p').value='';iniciar()});
$('#fc').addEventListener('submit',async e=>{e.preventDefault();const a=$('#n1').value.toUpperCase(),b=$('#n2').value.toUpperCase();
  if(a.length<6){$('#ce').textContent='Mínimo 6 caracteres.';return}if(a!==b){$('#ce').textContent='Las claves no coinciden.';return}
  const r=await sb.auth.updateUser({password:a});if(r.error){$('#ce').textContent=r.error.message;return}
  await sb.rpc('marcar_clave_cambiada');iniciar()});
$('#out').addEventListener('click',async()=>{if(canal){sb.removeChannel(canal);canal=null}await sb.auth.signOut();location.reload()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}});
$('#q').addEventListener('input',render);
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)accion(b.dataset.a,b.dataset.id)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
iniciar();

</script>
</body>
</html>
